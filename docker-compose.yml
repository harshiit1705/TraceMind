services:
  db:
    image: postgres:16-alpine
    container_name: tracemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracemind
      POSTGRES_PASSWORD: tracemind_secret
      POSTGRES_DB: tracemind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracemind -d tracemind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracemind-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg2://tracemind:tracemind_secret@db:5432/tracemind_db
      DEMO_MODE: "true"
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:

